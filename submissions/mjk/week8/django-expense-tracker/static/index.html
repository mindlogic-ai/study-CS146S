<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가계부</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <h1>가계부</h1>

    <!-- Summary Cards -->
    <div class="cards">
        <div class="card card-income">
            <h3>총수입</h3>
            <p id="total-income">₩0</p>
        </div>
        <div class="card card-expense">
            <h3>총지출</h3>
            <p id="total-expense">₩0</p>
        </div>
        <div class="card card-balance">
            <h3>잔액</h3>
            <p id="balance">₩0</p>
        </div>
    </div>

    <!-- Charts -->
    <div class="charts">
        <div class="chart-container">
            <canvas id="pie-chart"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="bar-chart"></canvas>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <input type="month" id="filter-month">
        <select id="filter-category">
            <option value="">전체 카테고리</option>
        </select>
        <select id="filter-type">
            <option value="">전체</option>
            <option value="income">수입</option>
            <option value="expense">지출</option>
        </select>
        <button class="btn btn-primary" onclick="showModal()">새 거래 추가</button>
    </div>

    <!-- Transaction Table -->
    <table id="transaction-table">
        <thead>
            <tr>
                <th>날짜</th>
                <th>타입</th>
                <th>카테고리</th>
                <th>메모</th>
                <th>금액</th>
                <th>액션</th>
            </tr>
        </thead>
        <tbody id="table-body">
        </tbody>
    </table>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2 id="modal-title">새 거래 추가</h2>
            <form id="transaction-form" onsubmit="event.preventDefault(); saveTransaction();">
                <input type="hidden" id="form-id">
                <div class="form-group">
                    <label>타입</label>
                    <div class="radio-group">
                        <label><input type="radio" name="type" value="expense" checked onchange="updateCategoryOptions()"> 지출</label>
                        <label><input type="radio" name="type" value="income" onchange="updateCategoryOptions()"> 수입</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="form-category">카테고리</label>
                    <select id="form-category" required></select>
                </div>
                <div class="form-group">
                    <label for="form-amount">금액</label>
                    <input type="number" id="form-amount" min="0" required>
                </div>
                <div class="form-group">
                    <label for="form-date">날짜</label>
                    <input type="date" id="form-date" required>
                </div>
                <div class="form-group">
                    <label for="form-description">메모</label>
                    <input type="text" id="form-description">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">저장</button>
                    <button type="button" class="btn" onclick="hideModal()">취소</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
