[project]
name = "investment-helper-mcp"
version = "1.0.0"
description = "MCP server for investment decision-making with stock and crypto data"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "yfinance>=0.2.36",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    # HTTP/SSE transport dependencies
    "starlette>=0.37.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
investment-helper = "server.main:main"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
